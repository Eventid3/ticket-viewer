<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Board</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='2' width='4' height='12' rx='1' fill='%234f6bed'/><rect x='6' y='2' width='4' height='8' rx='1' fill='%234f6bed' opacity='.7'/><rect x='11' y='2' width='4' height='5' rx='1' fill='%234f6bed' opacity='.45'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Tickets</h1>
    <select id="project" aria-label="Project"></select>
    <span id="alerts" class="alerts" aria-live="polite"></span>
    <select id="feature" aria-label="Feature"></select>
    <input id="search" type="search" placeholder="Filter by number, title, text…" aria-label="Filter">
    <label class="toggle"><input id="hideEmpty" type="checkbox"> Hide empty lanes</label>
    <label class="toggle"><input id="unblockedOnly" type="checkbox"> Unblocked only</label>
    <span id="stats" class="stats"></span>
    <span id="live" class="live" title="Live reload">●</span>
  </header>

  <main id="board" class="board"></main>

  <aside id="drawer" class="drawer" data-keep="drawer" hidden>
    <div class="drawer-head">
      <div>
        <div id="drawerMeta" class="drawer-meta"></div>
        <h2 id="drawerTitle"></h2>
      </div>
      <button id="drawerClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="drawerLinks" class="drawer-links"></div>
    <section id="drawerAgent" class="agent" hidden></section>
    <article id="drawerBody" class="markdown"></article>
  </aside>
  <div id="toast" class="toast" hidden></div>

  <dialog id="projectsDialog" class="projects-dialog" aria-labelledby="projectsTitle">
    <div class="drawer-head">
      <h2 id="projectsTitle">Projects</h2>
      <button id="projectsClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <form id="projectForm" class="project-form">
      <label for="projectPath">Add project</label>
      <div class="project-add">
        <input id="projectPath" type="text" placeholder="/home/you/code/my-project or ~/code/my-project" autocomplete="off" spellcheck="false">
        <button id="projectAdd" class="btn primary" type="submit">Add</button>
      </div>
      <p class="project-hint">Absolute path of a repo root, its .scratch folder, or one feature folder.</p>
      <p id="projectError" class="project-error" role="alert" hidden></p>
    </form>
    <ul id="projectList" class="project-list"></ul>
    <p id="projectListEmpty" class="project-hint">No projects yet.</p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
